version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srivani_saas_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-srivani_admin}:${POSTGRES_PASSWORD:-ChangeMeSecurePostgresPassword2026!}@db:5432/${POSTGRES_DB:-srivani_saas}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-srivani_admin}:${POSTGRES_PASSWORD:-ChangeMeSecurePostgresPassword2026!}@db:5432/${POSTGRES_DB:-srivani_saas}
      - SECRET_KEY=${SECRET_KEY:-srivani-saas-production-strong-jwt-secret-key-32-chars-long!}
      - STORAGE_DIR=/app/storage/tenants
    volumes:
      - saas_storage:/app/storage
      - ./data:/app/data
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - srivani_internal

  db:
    image: postgres:16-alpine
    container_name: srivani_saas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srivani_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePostgresPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-srivani_saas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srivani_admin} -d ${POSTGRES_DB:-srivani_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srivani_internal

  redis:
    image: redis:7-alpine
    container_name: srivani_saas_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - srivani_internal

  nginx:
    image: nginx:alpine
    container_name: srivani_saas_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - srivani_internal

volumes:
  pgdata:
  redisdata:
  saas_storage:

networks:
  srivani_internal:
    driver: bridge
