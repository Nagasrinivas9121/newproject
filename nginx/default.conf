# ==============================================================================
# SRIVANI BOOKING MANAGER - NGINX REVERSE PROXY & GATEWAY CONFIGURATION
# TLS 1.3, HSTS, Rate Limiting & Zero-Trust Headers
# ==============================================================================

# Rate limiting zone: 20 requests per second per IP
limit_req_zone $binary_remote_addr zone=saas_api_limit:10m rate=20r/s;

upstream saas_backend {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Redirect all plain HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    # TLS Certificates (self-signed in dev, Let's Encrypt / CA in prod)
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Strong SSL Protocol & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; img-src 'self' data:;" always;

    # File upload limit (15MB to permit 10MB ticket PDFs)
    client_max_body_size 15M;

    # Reverse proxy to FastAPI application
    location / {
        limit_req zone=saas_api_limit burst=30 nodelay;

        proxy_pass http://saas_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large report downloads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
